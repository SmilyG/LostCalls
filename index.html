<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostCalls - JCM Audio Gateway</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ffcc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        h1 { font-size: 1.5rem; text-align: center; margin-top: 0; }
        .status-box {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px dashed #00ffcc;
            font-size: 0.9rem;
            background: #151515;
            word-wrap: break-word;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #00ffcc;
            color: #fff;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            background: #00ffcc;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #00b399; }
        .recording { background: #ff4444 !important; color: white !important; }
        .log-area {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LOSTCALLS // JCM ENGINE</h1>
    
    <div>
        <label for="gateway-url">Secure Gateway Tunnel (HTTPS):</label>
        <input type="text" id="gateway-url" placeholder="https://your-tunnel.trycloudflare.com">
    </div>

    <div class="status-box" id="bridge-status">
        [System]: Awaiting Gateway URL to initialize JCM connection...
    </div>

    <div>
        <button id="mic-btn" onclick="toggleRecording()">[START] Audio Transmission</button>
    </div>

    <div class="log-area" id="log-output">
        [Log]: PWA initialized. Awaiting secure tunnel link.<br>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    function logMessage(msg) {
        const logArea = document.getElementById("log-output");
        logArea.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    function getGateway() {
        let url = document.getElementById("gateway-url").value.trim();
        return url.endsWith('/') ? url.slice(0, -1) : url;
    }

    async function checkBridgeStatus() {
        const url = getGateway();
        if (!url) return;

        try {
            const response = await fetch(`${url}/status`, { signal: AbortSignal.timeout(2000) });
            if (response.ok) {
                const data = await response.json();
                document.getElementById("bridge-status").innerHTML = 
                    `<strong>JCM Status:</strong> ${data.status} | <strong>Topology State:</strong> ${data.topology_state}`;
            } else {
                throw new Error("Invalid response");
            }
        } catch (error) {
            document.getElementById("bridge-status").innerHTML = 
                `<span style="color: #ff5555;">[Error]: Gateway unreachable. Check URL or tunnel.</span>`;
        }
    }

    async function toggleRecording() {
        const btn = document.getElementById("mic-btn");

        if (isRecording) {
            mediaRecorder.stop();
            btn.textContent = "[START] Audio Transmission";
            btn.classList.remove("recording");
            isRecording = false;
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    await dispatchAudio(audioBlob);
                };

                mediaRecorder.start();
                btn.textContent = "[STOP] Recording & Send";
                btn.classList.add("recording");
                isRecording = true;
                logMessage("Capturing encrypted audio transmission...");
            } catch (err) {
                logMessage("Error: Microphone access denied or unavailable.");
            }
        }
    }

    async function dispatchAudio(blob) {
        const url = getGateway();
        if (!url) {
            logMessage("Error: No gateway URL provided.");
            return;
        }

        logMessage("Converting transmission payload to Base64...");
        const reader = new FileReader();
        reader.readAsDataURL(blob); 
        reader.onloadend = async function() {
            const base64Audio = reader.result;
            
            try {
                const response = await fetch(`${url}/dispatch`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ audio_data: base64Audio }),
                    signal: AbortSignal.timeout(5000)
                });

                if (response.ok) {
                    const result = await response.json();
                    logMessage(`JCM Dispatch: ${result.action} | Matrix Health: ${result.gateway_status}`);
                } else {
                    throw new Error("Dispatch failed");
                }
            } catch (error) {
                logMessage(`[Local Fallback]: JCM Bridge unreachable. Audio queued offline.`);
            }
        }
    }

    setInterval(checkBridgeStatus, 3000);
</script>

</body>
</html>
